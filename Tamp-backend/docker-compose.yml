# Local Postgres for TAMP. `restart: unless-stopped` means the database comes
# back automatically whenever Docker is running (e.g. after a reboot or after
# Docker Desktop relaunches) — so it stops dropping out from under the app.
#
#   docker compose up -d      # start (or bring back) the database
#   docker compose down       # stop it (data is kept in the named volume)
#   docker compose down -v     # stop AND delete the data volume (careful!)
#
# Matches DATABASE_URL: postgres://tamp:tamp@localhost:5433/tamp

services:
  postgres:
    image: postgres:16
    container_name: tamp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tamp
      POSTGRES_PASSWORD: tamp
      POSTGRES_DB: tamp
    ports:
      - "5433:5432"
    volumes:
      - tamp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamp -d tamp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tamp_pgdata:
