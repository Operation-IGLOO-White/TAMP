<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0d0e12" />
    <title>TAMP — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:#0d0e12;color:#f7f7f8;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:430px;border:1px solid #34353c;border-radius:24px;background:#17181d;padding:28px;box-shadow:0 24px 70px #0008}.brand{font-size:32px;font-weight:900;letter-spacing:-2px}.brand b{color:#eab308}.line{width:54px;height:4px;border-radius:8px;background:#eab308;margin:20px 0}h1{font-size:24px;margin:0 0 10px}p{color:#aaaab2;line-height:1.6;margin:0 0 22px}button{width:100%;height:48px;border:0;border-radius:14px;background:#eab308;color:#0d0e12;font-weight:900;cursor:pointer}
    </style>
  </head>
  <body><main class="card"><div class="brand">TAM<b>P</b></div><div class="line"></div><h1>You are offline</h1><p>Previously opened TAMP screens remain available where cached. Reconnect before submitting trip, load or payment changes.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
