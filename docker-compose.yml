services:
  frontend:
    image: tamp-frontend:${TAG:-latest}
    build:
      context: .
    environment:
      BACKEND_TARGET: ${BACKEND_TARGET:-http://backend:5000}
    networks:
      - tamp
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

networks:
  tamp:
    external: true
    name: ${TAMP_NETWORK:-tamp-network}
